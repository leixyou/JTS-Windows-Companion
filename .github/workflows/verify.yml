name: Windows source verification
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - run: dotnet build JTS.WindowsCompanion.sln --configuration Release
      - name: Verify native PowerShell Unicode and cancellation contracts
        run: dotnet test tests/JTS.WindowsCompanion.Tests --configuration Release --no-build --filter "FullyQualifiedName~PowerShellUtf8Tests|FullyQualifiedName~ElevatedPowerShellContainmentTests|FullyQualifiedName~ElevationBrokerLeaseCancellationTests" --logger "trx;LogFileName=powershell-utf8.trx" --results-directory "${{ runner.temp }}/jts-powershell-utf8"
      - name: Diagnose Windows PowerShell stdin ownership
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'jts-powershell-utf8'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          ./scripts/tests/diagnose-powershell-stdin.ps1 | Tee-Object -FilePath (Join-Path $evidence 'stdin-diagnosis.jsonl')
      - name: Preserve native PowerShell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-utf8
          path: ${{ runner.temp }}/jts-powershell-utf8
          if-no-files-found: error
      - run: dotnet restore JTS.WindowsCompanion.Next.slnx --locked-mode
      - run: dotnet build JTS.WindowsCompanion.Next.slnx --configuration Release --no-restore
      - name: Verify locked self-contained packaging graphs
        shell: pwsh
        run: |
          $packageArtifacts = Join-Path $env:RUNNER_TEMP 'jts-next-package-restore'
          foreach ($role in @('AuthorityService', 'WorkerRunner', 'AuthorityProvisioner', 'UnattendedSetup')) {
            dotnet restore "src/JTS.WindowsCompanion.$role/JTS.WindowsCompanion.$role.csproj" --locked-mode --nologo --runtime win-x64 --artifacts-path $packageArtifacts -p:SelfContained=true -p:JtsNextPackageBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (git status --porcelain -- packaging/next-locks) {
            throw 'Packaging restore changed or created an uncommitted dependency lock.'
          }
      - run: dotnet test tests/JTS.WindowsCompanion.Control.Tests --configuration Release --no-build
      - run: dotnet test tests/JTS.WindowsCompanion.Runtime.Tests --configuration Release --no-build --filter "FullyQualifiedName~OwnerReactivationTests|FullyQualifiedName~OwnerRevocationDrainTests"
      - run: dotnet test tests/JTS.WindowsCompanion.Relay.Tests --configuration Release --no-build
      - run: dotnet test tests/JTS.WindowsCompanion.UnattendedInstallation.Tests --configuration Release --no-build
      - run: dotnet test tests/JTS.WindowsCompanion.Enrollment.Tests --configuration Release --no-build
      - name: Verify connection wrapper on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-connection-package-plan.ps1
      - name: Verify native Windows identity, pinned TLS and standard-account execution
        shell: pwsh
        run: |
          ./scripts/tests/run-native-identity-ci.ps1 -TestOutputDirectory ./tests/JTS.WindowsCompanion.Pairing.Tests/bin/Release/net10.0 -ExecutionTestOutputDirectory ./tests/JTS.WindowsCompanion.Execution.Tests/bin/Release/net10.0 -EvidenceDirectory "$env:RUNNER_TEMP/jts-native-identity-evidence"
      - name: Preserve native identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-identity
          path: ${{ runner.temp }}/jts-native-identity-evidence
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.tests.test_companion_next_package scripts.tests.test_companion_bundle_inspection scripts.tests.test_companion_native_inspection
