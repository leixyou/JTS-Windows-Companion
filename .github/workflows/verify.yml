name: Windows source verification
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - run: dotnet build JTS.WindowsCompanion.sln --configuration Release
      - run: dotnet restore JTS.WindowsCompanion.Next.slnx --locked-mode
      - run: dotnet build JTS.WindowsCompanion.Next.slnx --configuration Release --no-restore
      - run: dotnet test tests/JTS.WindowsCompanion.Control.Tests --configuration Release --no-build
      - run: dotnet test tests/JTS.WindowsCompanion.Relay.Tests --configuration Release --no-build
      - run: dotnet test tests/JTS.WindowsCompanion.UnattendedInstallation.Tests --configuration Release --no-build
      - name: Verify connection wrapper on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-connection-package-plan.ps1
      - name: Verify native Windows identity and pinned TLS
        shell: pwsh
        run: |
          ./scripts/tests/run-native-identity-ci.ps1 -TestOutputDirectory ./tests/JTS.WindowsCompanion.Pairing.Tests/bin/Release/net10.0 -EvidenceDirectory "$env:RUNNER_TEMP/jts-native-identity-evidence"
      - name: Preserve native identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-identity
          path: ${{ runner.temp }}/jts-native-identity-evidence
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.tests.test_companion_next_package scripts.tests.test_companion_bundle_inspection scripts.tests.test_companion_native_inspection
